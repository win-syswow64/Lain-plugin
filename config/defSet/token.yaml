# 示例配置
default:
  "default":
    model: 0                              # 0-全部启用  1-仅启用QQ频道  2-仅启用QQ群Bot  3-不启用
    appid: "default"                    # 开发者ip
    sandbox: false                        # 沙盒  true-开启  false-关闭
    allMsg: true                          # QQ频道接收全部消息  true-私域  false-公域
    groupAllMsg: false                    # QQ群订阅全量群消息；默认只接收 @ 机器人消息
    token:                                # 机器人令牌
    secret:                               # 机器人密钥
    maxRetry: 10                          # 重连次数
    toCallback: true                      # QQGuild频道callback兼容选项；QQ群/C2C显式callback始终使用回调
    markdown:                            # 每个 AppID 单独配置：raw / legacy / template
      mode: raw
      templateId: ""                     # 模板模式或 raw 失败后降级的模板 ID
      params: []                         # 模板参数名，按正文各行填充，最后一个参数接收剩余正文
    smallbtn: false                       # 原生小按钮；也可单条消息使用 segment.custom('small')
    qqImageHost: true                     # 官方 Markdown 图片素材图床；false 使用现有自定义/公网图床
    silk: false                           # 可选音频 Silk 转码；默认关闭，MP3/WAV/OGG 等直接上传
    other:                                # 其他配置
      Prefix: true                        # QQ频道、QQ群Bot前缀转换 [/] => [#]   true-开启  false-关闭
      QQCloud:                            # QQ群Bot => QQ图床，填写QQ号。需使用QQ发送图片
      Tips: false                         # QQ群Bot => 进入新群后，发送防倒卖提示  true-开启  false-关闭
      Tips-GroupId:                       # QQ群Bot => 防倒卖提示中的QQ群号

token:

  
